<!--
  Email para entrar en Limpieza de casa (US-01 y US-26).
  Se usa para «Magic Link» y para «Confirm signup» (el primer email de un usuario nuevo).
  Lleva el enlace y también el código: en el iPhone, la app instalada no recibe
  la sesión del enlace (se abre en Safari), así que allí se escribe el código.

  En local lo usa supabase/config.toml. En la nube hay que pegarlo en
  Supabase → Authentication → Email Templates (en las dos plantillas).
-->
<h2>Entra en Limpieza de casa</h2>

<p>Pulsa este enlace para entrar:</p>
<p><a href="{{ .ConfirmationURL }}">Entrar en Limpieza de casa</a></p>

<p>¿Tienes la app instalada en el iPhone? Vuelve a la app y escribe este código:</p>
<p style="font-size: 28px; font-weight: bold; letter-spacing: 6px;">{{ .Token }}</p>

<p>El enlace y el código caducan en una hora y solo sirven una vez.<br>
Si no has pedido entrar, ignora este email.</p>
