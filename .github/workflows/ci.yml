# Integración continua: en cada pull request y en cada cambio en main,
# GitHub pasa todas las pruebas y compila la app. Si algo falla, el pull request
# lo muestra en rojo antes de fusionarlo: así se detectan las regresiones.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Pruebas y compilación
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Pruebas unitarias y de integración (Vitest)
        run: npm test

      - name: Comprobar tipos y compilar
        run: npm run build

      - name: Instalar el navegador de Playwright
        run: npx playwright install --with-deps chromium

      - name: Pruebas de extremo a extremo (Playwright)
        run: npm run test:e2e

      - name: Guardar el informe de Playwright si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
