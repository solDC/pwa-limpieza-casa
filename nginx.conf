server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Cualquier ruta de la app devuelve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Estos archivos no se cachean, para que las actualizaciones lleguen enseguida
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /registerSW.js {
        add_header Cache-Control "no-cache";
    }

    # El manifiesto de la PWA con su tipo correcto
    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "no-cache";
    }

    # Los archivos compilados llevan un hash en el nombre: se pueden cachear para siempre
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
